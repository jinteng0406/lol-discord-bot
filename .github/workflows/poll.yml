name: poll

on:
  schedule:
    # Off the :00 mark, where GitHub most often delays or drops scheduled runs
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    # Windows PowerShell 5.1 + System.Drawing, same as the home PC (radar images are composited locally)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Post schedule and results
        timeout-minutes: 6
        shell: powershell
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: ./bot.ps1

      # DM the server owner after alertAfterMinutes without a successful run, and again on recovery
      - name: Failure alert
        if: failure() || cancelled()
        shell: powershell
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: ./alert.ps1 -Status failed

      - name: Recovery notice
        if: success()
        shell: powershell
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: ./alert.ps1 -Status ok

      # GitHub disables scheduled workflows after 60 days without repo activity; re-enable every Monday
      - name: Keep schedule enabled
        if: always() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u%H)" = "100" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/poll.yml/enable"
          fi
